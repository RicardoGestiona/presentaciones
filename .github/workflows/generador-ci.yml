name: generador-ci

on:
  push:
    branches: [main]
    paths:
      - 'generador/**'
      - '.github/workflows/generador-ci.yml'
  pull_request:
    paths:
      - 'generador/**'
      - '.github/workflows/generador-ci.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generador

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: generador/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync assets parity check
        run: npm run sync-assets

      - name: Run tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
